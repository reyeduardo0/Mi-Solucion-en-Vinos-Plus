    <!-- Fix: Ensure window.fetch has both getter and setter so assigning to fetch does not throw TypeError -->
    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _fetch = originalFetch;

          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || !desc.set || !desc.writable) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _fetch;
                },
                set: function(fn) {
                  _fetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return _fetch;
                    },
                    set: function(fn) {
                      _fetch = fn;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (e2) {}
            }
          }
        } catch (err) {
          console.warn('Fetch setter initialization warning:', err);
        }
      })();
    </script>
